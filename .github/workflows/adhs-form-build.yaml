# To better understand this file read this:
# https://docs.ionos.space/docs/github-actions-customization/

name: "Deploy Now: Execute Build"

on:
  workflow_call:
    inputs:
      site-url:
        required: true
        type: string
      branch-id:
        required: true
        type: string

env:
  # Setze das Verzeichnis, das hochgeladen werden soll.
  # '.' bedeutet Repo-Root. Wenn du htdocs verwendest, ändere es zu './htdocs'
  DEPLOYMENT_FOLDER: .

jobs:
  build-project:
    name: build adhs-form
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # --- NEU: HTML-Datei als index.html umbenennen ---
      - name: Rename HTML to index.html
        run: |
          # Prüfen, ob die Datei existiert
          if [ -f "adhs_form_html(2).html" ]; then
            mv adhs_form_html\(2\).html index.html
          fi

      # Optional: in htdocs verschieben (falls IONOS es verlangt)
      # - name: Move index.html to htdocs
      #   run: |
      #     mkdir -p htdocs
      #     mv index.html htdocs/
      # DEPLOYMENT_FOLDER: ./htdocs

      # Bitte nicht verändern: Upload zur IONOS-Action
      - name: Store deployment content
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: 9d666e56-57b3-4410-bd69-ee12d156d5a0
          branch-id: ${{ inputs.branch-id }}
          version: ${{ github.sha }}
          folder: ${{ env.DEPLOYMENT_FOLDER }}
          config-file: .deploy-now/adhs-form/config.yaml
          action: upload
